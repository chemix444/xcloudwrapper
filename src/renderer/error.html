<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' file:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Connection problem</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0e1113;
      color: #e8eaed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    main { max-width: 30rem; padding: 2rem; text-align: center; }
    .glyph { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 0.5rem; }
    p { color: #9aa0a6; line-height: 1.5; margin-bottom: 0.4rem; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      color: #6f7680;
    }
    button {
      margin-top: 1.25rem;
      padding: 0.6rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: #107c10;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #1a8c1a; }
    button:active { background: #0b5c0b; }
    .hint { font-size: 0.8rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <main>
    <div class="glyph">☁️</div>
    <h1>Can't reach Xbox Cloud Gaming</h1>
    <p id="description">The connection was interrupted.</p>
    <p><code id="detail"></code></p>
    <button id="retry" autofocus>Try Again</button>
    <p class="hint">Retries automatically when your connection comes back.</p>
  </main>
  <script src="./error.js"></script>
</body>
</html>
